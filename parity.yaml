settings:
  namespace_roots:
    src: ShipperCli\ProviderForge
    tests: ShipperCli\ProviderForge\Tests

coverage_xml: .parity/per-test

test:
  command: "XDEBUG_MODE=coverage vendor/bin/pest {test_abs} --coverage-filter=src --coverage-clover={coverage} --colors=never"
  coverage: ".parity/tmp/{slug}.xml"
  reports: ".parity/per-test"

structure:
  - name: Forge provider
    paths:
      source: src
      test: tests
    file_map:
      ForgeInventoryClient.php: InventoryValidationTest.php
    rules: []
